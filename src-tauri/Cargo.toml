# ABOUTME: Cargo manifest for the Tauri 2 backend of Glitch Spot.
# ABOUTME: Declares the glitch_spot crate with lib and binary targets.
[package]
name = "glitch_spot"
version = "0.1.0"
description = "Glitch Spot – Tauri 2 backend"
authors = []
edition = "2021"
rust-version = "1.77.2"
default-run = "glitch_spot"

[lib]
name = "glitch_spot"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screencapturekit = { version = "6", features = ["macos_14_0"] }
thiserror = "1"
serde_bytes = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-autostart = "2"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
rand = "0.8"
subtle = "2"
base64 = "0.22"
async-trait = "0.1"
toml = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-notification = "2"
futures = "0.3"
# objc2 lets us call NSApplication.activateIgnoringOtherApps directly to make
# the Accessory-mode app frontmost without using set_focus (which on macOS
# triggers NSWindow.constrainFrameRect and relocates oversized windows).
objc2 = "0.6"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
filetime = "0.2"

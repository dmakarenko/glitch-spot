# ABOUTME: Cargo manifest for the Tauri 2 backend of Glitch Spot.
# ABOUTME: Declares the glitch_spot crate with lib and binary targets.
[package]
name = "glitch_spot"
version = "0.1.0"
description = "Glitch Spot – Tauri 2 backend"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glitch_spot"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screencapturekit = { version = "6", features = ["macos_14_0"] }
thiserror = "1"
serde_bytes = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
